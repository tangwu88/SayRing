name: iOS Ad Hoc Test IPA

on:
  workflow_dispatch:
    inputs:
      build_name:
        description: App version, for example 0.1.0
        required: false
        default: 0.1.0
        type: string
      build_number:
        description: Positive integer; defaults to the GitHub run number
        required: false
        type: string
  push:
    tags:
      - ios-test-v*

permissions:
  contents: read

concurrency:
  group: ios-test-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ipa:
    name: Build signed Ad Hoc IPA
    runs-on: macos-26
    timeout-minutes: 45
    environment: ios-adhoc
    env:
      IOS_BUNDLE_ID: cc.saidian.app
      FLUTTER_VERSION: 3.44.9

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Gate source revision before loading signing secrets
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          if [[ "$EVENT_NAME" == "push" ]]; then
            [[ "$RELEASE_TAG" =~ ^ios-test-v[0-9]+\.[0-9]+\.[0-9]+\+[1-9][0-9]*$ ]] || {
              echo "iOS test tag must be ios-test-vX.Y.Z+BUILD." >&2
              exit 1
            }
            [[ "$(git cat-file -t "$RELEASE_TAG")" == "tag" ]] || {
              echo "Signed Ad Hoc builds require an annotated tag." >&2
              exit 1
            }
            [[ "$(git rev-list -n 1 "$RELEASE_TAG")" == "$(git rev-parse HEAD)" ]] || {
              echo "Checked-out commit does not match the iOS test tag." >&2
              exit 1
            }
          fi
          git merge-base --is-ancestor HEAD origin/main || {
            echo "Signed Ad Hoc builds must use a commit already contained in origin/main." >&2
            exit 1
          }
          [[ -z "$(git status --porcelain)" ]]

      - name: Select Xcode 26.5
        run: |
          set -euo pipefail
          test -d /Applications/Xcode_26.5.app
          sudo xcode-select --switch /Applications/Xcode_26.5.app/Contents/Developer
          xcodebuild -version

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve build metadata
        id: metadata
        env:
          INPUT_BUILD_NAME: ${{ inputs.build_name }}
          INPUT_BUILD_NUMBER: ${{ inputs.build_number }}
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.ref_name }}
          CONFIGURED_API_BASE_URL: ${{ vars.SAYDIAN_API_BASE_URL }}
          CONFIGURED_UPDATE_MANIFEST_URL: ${{ vars.SAYDIAN_UPDATE_MANIFEST_URL }}
          CONFIGURED_UPDATE_ALLOWED_HOSTS: ${{ vars.SAYDIAN_UPDATE_ALLOWED_HOSTS }}
          CONFIGURED_JPUSH_APP_KEY: ${{ secrets.JPUSH_APP_KEY }}
          CONFIGURED_WECHAT_APP_ID: ${{ vars.SAIDIAN_WECHAT_APP_ID }}
          CONFIGURED_WECHAT_UNIVERSAL_LINK: ${{ vars.SAIDIAN_WECHAT_UNIVERSAL_LINK }}
          CONFIGURED_WECHAT_UNIVERSAL_LINK_HOST: ${{ vars.SAIDIAN_WECHAT_UNIVERSAL_LINK_HOST }}
          CONFIGURED_ALIPAY_URL_SCHEME: ${{ vars.SAIDIAN_ALIPAY_URL_SCHEME }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "push" ]]; then
            release_metadata="${RELEASE_TAG#ios-test-v}"
            build_name="${release_metadata%%+*}"
            build_number="${release_metadata##*+}"
          else
            build_name="${INPUT_BUILD_NAME:-}"
            if [[ -z "$build_name" ]]; then
              build_name="$(awk '/^version:/{split($2, version, "+"); print version[1]; exit}' pubspec.yaml)"
            fi
            build_number="${INPUT_BUILD_NUMBER:-$GITHUB_RUN_NUMBER}"
          fi
          [[ "$build_name" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || {
            echo "build_name must be a semantic X.Y.Z version." >&2
            exit 1
          }

          if ! [[ "$build_number" =~ ^[1-9][0-9]*$ ]]; then
            echo "build_number must be a positive integer." >&2
            exit 1
          fi

          api_base_url="${CONFIGURED_API_BASE_URL:-}"
          update_manifest_url="${CONFIGURED_UPDATE_MANIFEST_URL:-}"
          update_allowed_hosts="${CONFIGURED_UPDATE_ALLOWED_HOSTS:-}"
          jpush_app_key="${CONFIGURED_JPUSH_APP_KEY:-}"
          wechat_app_id="${CONFIGURED_WECHAT_APP_ID:-}"
          wechat_universal_link="${CONFIGURED_WECHAT_UNIVERSAL_LINK:-}"
          wechat_universal_link_host="${CONFIGURED_WECHAT_UNIVERSAL_LINK_HOST:-}"
          alipay_url_scheme="${CONFIGURED_ALIPAY_URL_SCHEME:-}"
          API_BASE_URL="$api_base_url" UPDATE_MANIFEST_URL="$update_manifest_url" \
            UPDATE_ALLOWED_HOSTS="$update_allowed_hosts" \
            WECHAT_APP_ID="$wechat_app_id" \
            WECHAT_UNIVERSAL_LINK="$wechat_universal_link" \
            WECHAT_UNIVERSAL_LINK_HOST="$wechat_universal_link_host" \
            ALIPAY_URL_SCHEME="$alipay_url_scheme" python3 - <<'PY'
          import os
          import re
          from urllib.parse import urlparse

          def https_url(name, value, *, manifest=False):
              parsed = urlparse(value)
              if (parsed.scheme != "https" or not parsed.hostname or parsed.username or
                      parsed.password or parsed.fragment):
                  raise SystemExit(f"{name} must be an explicit public HTTPS URL.")
              if manifest and (parsed.query or not parsed.path.endswith("/app-update.json")):
                  raise SystemExit(f"{name} must end with /app-update.json and have no query.")
              return parsed.hostname.lower()

          api_host = https_url("SAYDIAN_API_BASE_URL", os.environ["API_BASE_URL"])
          manifest_host = https_url(
              "SAYDIAN_UPDATE_MANIFEST_URL",
              os.environ["UPDATE_MANIFEST_URL"],
              manifest=True,
          )
          hosts = {
              value.strip().lower().rstrip(".")
              for value in os.environ["UPDATE_ALLOWED_HOSTS"].split(",")
              if value.strip()
          }
          if not hosts or any(not re.fullmatch(r"[a-z0-9.-]+", host) for host in hosts):
              raise SystemExit("SAYDIAN_UPDATE_ALLOWED_HOSTS is invalid.")
          if manifest_host not in hosts or "apps.apple.com" not in hosts:
              raise SystemExit("Allowed hosts must include the manifest host and apps.apple.com.")
          if api_host.endswith((".invalid", ".test", ".example")):
              raise SystemExit("SAYDIAN_API_BASE_URL cannot use a reserved host.")

          wechat_app_id = os.environ["WECHAT_APP_ID"]
          if not re.fullmatch(r"wx[0-9A-Za-z]{8,}", wechat_app_id):
              raise SystemExit("SAIDIAN_WECHAT_APP_ID is invalid or missing.")
          wechat_host = os.environ["WECHAT_UNIVERSAL_LINK_HOST"].lower().rstrip(".")
          if not re.fullmatch(r"[a-z0-9](?:[a-z0-9.-]*[a-z0-9])?", wechat_host):
              raise SystemExit("SAIDIAN_WECHAT_UNIVERSAL_LINK_HOST is invalid or missing.")
          wechat_link = urlparse(os.environ["WECHAT_UNIVERSAL_LINK"])
          if (wechat_link.scheme != "https" or
                  (wechat_link.hostname or "").lower().rstrip(".") != wechat_host or
                  not wechat_link.path.endswith("/") or wechat_link.query or
                  wechat_link.fragment or wechat_link.username or wechat_link.password):
              raise SystemExit("SAIDIAN_WECHAT_UNIVERSAL_LINK must be HTTPS, match its host, and end with /.")
          if not re.fullmatch(r"[A-Za-z][A-Za-z0-9+.-]*", os.environ["ALIPAY_URL_SCHEME"]):
              raise SystemExit("SAIDIAN_ALIPAY_URL_SCHEME is invalid or missing.")
          PY
          [[ ${#jpush_app_key} -ge 8 ]] || {
            echo "JPUSH_APP_KEY is required for an iOS release build." >&2
            exit 1
          }
          for value in "$api_base_url" "$update_manifest_url" "$update_allowed_hosts" \
            "$jpush_app_key" "$wechat_app_id" "$wechat_universal_link" \
            "$wechat_universal_link_host" "$alipay_url_scheme"; do
            [[ "$value" != *$'\n'* && "$value" != *$'\r'* ]] || {
              echo "Build configuration contains a forbidden control character." >&2
              exit 1
            }
          done
          {
            printf 'build_name=%s\n' "$build_name"
            printf 'build_number=%s\n' "$build_number"
            printf 'api_base_url=%s\n' "$api_base_url"
            printf 'update_manifest_url=%s\n' "$update_manifest_url"
            printf 'update_allowed_hosts=%s\n' "$update_allowed_hosts"
            printf 'wechat_app_id=%s\n' "$wechat_app_id"
            printf 'wechat_universal_link=%s\n' "$wechat_universal_link"
            printf 'wechat_universal_link_host=%s\n' "$wechat_universal_link_host"
            printf 'alipay_url_scheme=%s\n' "$alipay_url_scheme"
          } >> "$GITHUB_OUTPUT"

      - name: Install and validate Apple signing assets
        env:
          IOS_P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
          IOS_P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          EXPECTED_WECHAT_ASSOCIATED_DOMAIN: applinks:${{ steps.metadata.outputs.wechat_universal_link_host }}
        run: |
          set -euo pipefail

          for variable_name in IOS_P12_BASE64 IOS_P12_PASSWORD IOS_PROVISIONING_PROFILE_BASE64; do
            if [[ -z "${!variable_name:-}" ]]; then
              echo "Missing required GitHub Actions secret: $variable_name" >&2
              exit 1
            fi
          done

          certificate_path="$RUNNER_TEMP/ios-distribution.p12"
          profile_path="$RUNNER_TEMP/ios-adhoc.mobileprovision"
          profile_plist="$RUNNER_TEMP/ios-adhoc.plist"
          keychain_path="$RUNNER_TEMP/saidian-signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"

          printf '%s' "$IOS_P12_BASE64" | base64 --decode > "$certificate_path"
          printf '%s' "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$profile_path"
          security cms -D -i "$profile_path" > "$profile_plist"

          profile_uuid="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$profile_plist")"
          profile_name="$(/usr/libexec/PlistBuddy -c 'Print :Name' "$profile_plist")"
          team_id="$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "$profile_plist")"
          application_identifier="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$profile_plist")"
          push_environment="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:aps-environment' "$profile_plist" 2>/dev/null || true)"

          if [[ "$application_identifier" != "$team_id.$IOS_BUNDLE_ID" ]]; then
            echo "Provisioning profile is for '$application_identifier', expected '$team_id.$IOS_BUNDLE_ID'." >&2
            exit 1
          fi
          if [[ "$push_environment" != "production" ]]; then
            echo "The Ad Hoc provisioning profile must include production APNs entitlement." >&2
            exit 1
          fi
          if ! /usr/libexec/PlistBuddy -c 'Print :ProvisionedDevices:0' "$profile_plist" >/dev/null 2>&1; then
            echo "The provisioning profile contains no test devices; use an Ad Hoc profile." >&2
            exit 1
          fi
          if [[ "$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:get-task-allow' "$profile_plist" 2>/dev/null || true)" == "true" ]]; then
            echo "A Development profile was supplied; use an Ad Hoc distribution profile." >&2
            exit 1
          fi

          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" -P "$IOS_P12_PASSWORD" -A -t cert -f pkcs12 -k "$keychain_path"
          security set-key-partition-list -S apple-tool:,apple: -k "$keychain_password" "$keychain_path"
          security list-keychains -d user -s "$keychain_path"

          identity_line="$(security find-identity -v -p codesigning "$keychain_path" | grep -E '"(Apple Distribution|iPhone Distribution):' | head -n 1 || true)"
          if [[ -z "$identity_line" ]]; then
            echo "The P12 does not contain a valid Apple Distribution signing identity." >&2
            security find-identity -v -p codesigning "$keychain_path" || true
            exit 1
          fi
          signing_certificate_sha1="$(awk '{print $2}' <<< "$identity_line")"
          signing_identity="$(sed -E 's/.*"([^"]+)".*/\1/' <<< "$identity_line")"
          [[ "$profile_uuid" =~ ^[A-Fa-f0-9-]{36}$ ]]
          [[ "$team_id" =~ ^[A-Z0-9]{10}$ ]]
          for value in "$profile_name" "$signing_identity"; do
            [[ -n "$value" && "$value" != *$'\n'* && "$value" != *$'\r'* ]]
          done

          PROFILE_PLIST_PATH="$profile_plist" \
            SIGNING_CERTIFICATE_SHA1="$signing_certificate_sha1" \
            EXPECTED_WECHAT_ASSOCIATED_DOMAIN="$EXPECTED_WECHAT_ASSOCIATED_DOMAIN" \
            python3 - <<'PY'
          import datetime
          import hashlib
          import os
          import plistlib

          with open(os.environ["PROFILE_PLIST_PATH"], "rb") as stream:
              profile = plistlib.load(stream)

          expiration = profile["ExpirationDate"]
          if expiration.tzinfo is None:
              expiration = expiration.replace(tzinfo=datetime.timezone.utc)
          if expiration <= datetime.datetime.now(datetime.timezone.utc):
              raise SystemExit(f"Provisioning profile expired at {expiration.isoformat()}.")

          expected_sha1 = os.environ["SIGNING_CERTIFICATE_SHA1"].upper()
          allowed_sha1 = {
              hashlib.sha1(certificate).hexdigest().upper()
              for certificate in profile.get("DeveloperCertificates", [])
          }
          if expected_sha1 not in allowed_sha1:
              raise SystemExit("The provisioning profile was not created with the certificate in IOS_P12_BASE64.")
          associated_domains = profile.get("Entitlements", {}).get(
              "com.apple.developer.associated-domains", []
          )
          expected_domain = os.environ["EXPECTED_WECHAT_ASSOCIATED_DOMAIN"]
          if expected_domain not in associated_domains:
              raise SystemExit(
                  f"Provisioning profile is missing associated domain {expected_domain}."
              )
          PY

          installed_profile_dir="$HOME/Library/MobileDevice/Provisioning Profiles"
          installed_profile_path="$installed_profile_dir/$profile_uuid.mobileprovision"
          mkdir -p "$installed_profile_dir"
          cp "$profile_path" "$installed_profile_path"

          {
            echo "SAIDIAN_CODE_SIGN_IDENTITY=$signing_identity"
            echo "SAIDIAN_SIGNING_CERTIFICATE_SHA1=$signing_certificate_sha1"
            echo "SAIDIAN_DEVELOPMENT_TEAM=$team_id"
            echo "SAIDIAN_PROVISIONING_PROFILE_SPECIFIER=$profile_name"
            echo "INSTALLED_PROFILE_PATH=$installed_profile_path"
            echo "TEMP_KEYCHAIN_PATH=$keychain_path"
          } >> "$GITHUB_ENV"

          echo "Installed Ad Hoc profile '$profile_name' for team '$team_id'."

      - name: Validate bundled iOS SDK frameworks
        run: |
          set -euo pipefail
          frameworks=(
            ABParTool.framework
            DFUnits.framework
            GRDFUSDK.framework
            JLDialUnit.framework
            JL_BLEKit.framework
            VeepooBleSDK.framework
            ZipZap.framework
          )
          for framework in "${frameworks[@]}"; do
            framework_path="ios/Runner/Vendor/$framework"
            binary_path="$framework_path/${framework%.framework}"
            test -d "$framework_path"
            test -f "$binary_path"
            lipo -info "$binary_path"
          done

      - name: Install Flutter and CocoaPods dependencies
        run: |
          set -euo pipefail
          flutter pub get
          cd ios
          pod install

      - name: Create native payment configuration
        env:
          SAIDIAN_WECHAT_APP_ID: ${{ steps.metadata.outputs.wechat_app_id }}
          SAIDIAN_WECHAT_UNIVERSAL_LINK: ${{ steps.metadata.outputs.wechat_universal_link }}
          SAIDIAN_WECHAT_UNIVERSAL_LINK_HOST: ${{ steps.metadata.outputs.wechat_universal_link_host }}
          SAIDIAN_ALIPAY_URL_SCHEME: ${{ steps.metadata.outputs.alipay_url_scheme }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path

          def xcconfig(value):
              if any(character in value for character in ("\n", "\r", "$")):
                  raise SystemExit("Native payment configuration contains a forbidden character.")
              # A literal // starts an xcconfig comment. The empty build-setting
              # expansion preserves the URL while keeping the line parseable.
              return value.replace("://", ":/$()/")

          values = {
              "SAIDIAN_WECHAT_APP_ID": os.environ["SAIDIAN_WECHAT_APP_ID"],
              "SAIDIAN_WECHAT_UNIVERSAL_LINK": os.environ["SAIDIAN_WECHAT_UNIVERSAL_LINK"],
              "SAIDIAN_WECHAT_UNIVERSAL_LINK_HOST": os.environ["SAIDIAN_WECHAT_UNIVERSAL_LINK_HOST"],
              "SAIDIAN_ALIPAY_URL_SCHEME": os.environ["SAIDIAN_ALIPAY_URL_SCHEME"],
          }
          output = "// Generated by CI. Do not commit.\n" + "".join(
              f"{key} = {xcconfig(value)}\n" for key, value in values.items()
          )
          Path("ios/Flutter/Local.xcconfig").write_text(output, encoding="utf-8")
          PY

      - name: Create Ad Hoc export options
        run: |
          python3 - <<'PY'
          import os
          import plistlib

          export_options = {
              "destination": "export",
              "manageAppVersionAndBuildNumber": False,
              "method": "ad-hoc",
              "provisioningProfiles": {
                  os.environ["IOS_BUNDLE_ID"]: os.environ["SAIDIAN_PROVISIONING_PROFILE_SPECIFIER"],
              },
              "signingCertificate": os.environ["SAIDIAN_CODE_SIGN_IDENTITY"],
              "signingStyle": "manual",
              "stripSwiftSymbols": True,
              "teamID": os.environ["SAIDIAN_DEVELOPMENT_TEAM"],
          }
          with open(os.path.join(os.environ["RUNNER_TEMP"], "ExportOptions.plist"), "wb") as stream:
              plistlib.dump(export_options, stream)
          PY

      - name: Build signed IPA
        env:
          BUILD_NAME: ${{ steps.metadata.outputs.build_name }}
          BUILD_NUMBER: ${{ steps.metadata.outputs.build_number }}
          SAYDIAN_API_BASE_URL: ${{ steps.metadata.outputs.api_base_url }}
          SAYDIAN_UPDATE_MANIFEST_URL: ${{ steps.metadata.outputs.update_manifest_url }}
          SAYDIAN_UPDATE_ALLOWED_HOSTS: ${{ steps.metadata.outputs.update_allowed_hosts }}
          JPUSH_APP_KEY: ${{ secrets.JPUSH_APP_KEY }}
          SAIDIAN_WECHAT_APP_ID: ${{ steps.metadata.outputs.wechat_app_id }}
          SAIDIAN_WECHAT_UNIVERSAL_LINK: ${{ steps.metadata.outputs.wechat_universal_link }}
          SAIDIAN_WECHAT_UNIVERSAL_LINK_HOST: ${{ steps.metadata.outputs.wechat_universal_link_host }}
          SAIDIAN_ALIPAY_URL_SCHEME: ${{ steps.metadata.outputs.alipay_url_scheme }}
          SAIDIAN_PRODUCTION_RELEASE: "true"
          SAIDIAN_ALLOW_QA_RELEASE: "false"
        run: |
          set -euo pipefail
          flutter build ipa --release \
            --build-name "$BUILD_NAME" \
            --build-number "$BUILD_NUMBER" \
            --dart-define="SAYDIAN_API_BASE_URL=$SAYDIAN_API_BASE_URL" \
            --dart-define="SAYDIAN_UPDATE_MANIFEST_URL=$SAYDIAN_UPDATE_MANIFEST_URL" \
            --dart-define="SAYDIAN_UPDATE_ALLOWED_HOSTS=$SAYDIAN_UPDATE_ALLOWED_HOSTS" \
            --dart-define="JPUSH_APP_KEY=$JPUSH_APP_KEY" \
            --export-options-plist="$RUNNER_TEMP/ExportOptions.plist"

      - name: Verify and checksum IPA
        env:
          EXPECTED_WECHAT_ASSOCIATED_DOMAIN: applinks:${{ steps.metadata.outputs.wechat_universal_link_host }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          ipa_files=(build/ios/ipa/*.ipa)
          if (( ${#ipa_files[@]} == 0 )); then
            echo "No IPA was produced." >&2
            exit 1
          fi

          verification_dir="$RUNNER_TEMP/ipa-verification"
          mkdir -p "$verification_dir"
          unzip -q "${ipa_files[0]}" -d "$verification_dir"
          app_paths=("$verification_dir"/Payload/*.app)
          (( ${#app_paths[@]} == 1 ))
          app_path="${app_paths[0]}"
          codesign --verify --deep --strict --verbose=2 "$app_path"
          [[ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app_path/Info.plist")" == "$IOS_BUNDLE_ID" ]]
          [[ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app_path/Info.plist")" == "${{ steps.metadata.outputs.build_name }}" ]]
          [[ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$app_path/Info.plist")" == "${{ steps.metadata.outputs.build_number }}" ]]

          embedded_plist="$RUNNER_TEMP/embedded-profile.plist"
          security cms -D -i "$app_path/embedded.mobileprovision" > "$embedded_plist"
          [[ "$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$embedded_plist")" == \
             "$(basename "$INSTALLED_PROFILE_PATH" .mobileprovision)" ]]
          entitlements="$RUNNER_TEMP/final-entitlements.plist"
          codesign --display --entitlements "$entitlements" --xml "$app_path"
          [[ "$(/usr/libexec/PlistBuddy -c 'Print :aps-environment' "$entitlements")" == "production" ]]
          [[ "$(/usr/libexec/PlistBuddy -c 'Print :application-identifier' "$entitlements")" == \
             "$SAIDIAN_DEVELOPMENT_TEAM.$IOS_BUNDLE_ID" ]]
          FINAL_ENTITLEMENTS_PATH="$entitlements" \
            EXPECTED_WECHAT_ASSOCIATED_DOMAIN="$EXPECTED_WECHAT_ASSOCIATED_DOMAIN" \
            python3 - <<'PY'
          import os
          import plistlib

          with open(os.environ["FINAL_ENTITLEMENTS_PATH"], "rb") as stream:
              entitlements = plistlib.load(stream)
          domains = entitlements.get("com.apple.developer.associated-domains", [])
          expected = os.environ["EXPECTED_WECHAT_ASSOCIATED_DOMAIN"]
          if expected not in domains:
              raise SystemExit(f"Final IPA is missing associated domain {expected}.")
          PY
          cert_prefix="$RUNNER_TEMP/ipa-signing-cert-"
          codesign --display --extract-certificates "$cert_prefix" "$app_path"
          [[ "$(shasum -a 1 "${cert_prefix}0" | awk '{print toupper($1)}')" == \
             "$SAIDIAN_SIGNING_CERTIFICATE_SHA1" ]]

          shasum -a 256 "${ipa_files[@]}" > build/ios/ipa/SHA256SUMS.txt
          ls -lh build/ios/ipa

      - name: Remove signing assets before artifact upload
        run: |
          if [[ -n "${TEMP_KEYCHAIN_PATH:-}" ]]; then
            security delete-keychain "$TEMP_KEYCHAIN_PATH" 2>/dev/null || true
          fi
          if [[ -n "${INSTALLED_PROFILE_PATH:-}" ]]; then
            rm -f "$INSTALLED_PROFILE_PATH"
          fi
          rm -rf \
            "$RUNNER_TEMP/ios-distribution.p12" \
            "$RUNNER_TEMP/ios-adhoc.mobileprovision" \
            "$RUNNER_TEMP/ios-adhoc.plist" \
            "$RUNNER_TEMP/ExportOptions.plist" \
            "$RUNNER_TEMP/embedded-profile.plist" \
            "$RUNNER_TEMP/final-entitlements.plist" \
            "$RUNNER_TEMP/ipa-verification" \
            "$RUNNER_TEMP"/ipa-signing-cert-*

      - name: Upload IPA artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: saydian-ios-adhoc-${{ github.run_number }}
          path: |
            build/ios/ipa/*.ipa
            build/ios/ipa/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

      - name: Remove temporary signing assets
        if: always()
        run: |
          if [[ -n "${TEMP_KEYCHAIN_PATH:-}" ]]; then
            security delete-keychain "$TEMP_KEYCHAIN_PATH" 2>/dev/null || true
          fi
          if [[ -n "${INSTALLED_PROFILE_PATH:-}" ]]; then
            rm -f "$INSTALLED_PROFILE_PATH"
          fi
          rm -rf \
