name: mobile-ci

on:
  push:
  pull_request:

jobs:
  harmony-contracts:
    name: Harmony contracts (${{ matrix.timezone }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        timezone: [UTC, Asia/Shanghai]
    env:
      TZ: ${{ matrix.timezone }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Run Harmony host-side contracts and service regressions
        run: node --test harmony-native/tests/*.test.mjs
      - name: Check Android vendor log privacy controls
        run: node --test tool/test_native_log_privacy.mjs
      - name: Check international authentication smoke boundaries
        run: node --test tool/global_auth_smoke.test.mjs
      - name: Check isolated authentication QA safety (offline only)
        run: node --test tool/global_auth_account_qa.test.mjs

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: 3.44.9
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - name: Check client module and iOS size contracts
        run: node --test tool/measure_ios_bundle.test.mjs tool/client_package_contract.test.mjs
      - run: TZ=UTC flutter test --coverage
      - run: TZ=Asia/Shanghai flutter test
      - run: python3 -m unittest discover -s scripts/release -p 'test_*.py'
      - run: bash -n scripts/release/*.sh && shellcheck scripts/release/*.sh
      - run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

  android:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: 3.44.9
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build apk --debug --target-platform=android-arm,android-arm64
      - run: flutter build apk --release --target-platform=android-arm,android-arm64
        env:
          SAIDIAN_ALLOW_QA_RELEASE: "true"
      - run: cd android && ./gradlew :app:testDebugUnitTest
      - name: Verify SDK bytes and Release-to-Debug immutable cache regression
        run: |
          node tool/verify_qring_sdk_copy.mjs android/app/libs/qring_sdk_1.0.0.76.aar build/app/generated/qring-sdk/qring_sdk_1.0.0.76-build.aar
          flutter build apk --debug --target-platform=android-arm,android-arm64

  ios:
    runs-on: macos-26
    needs: quality
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Select Xcode 26.5
        run: sudo xcode-select --switch /Applications/Xcode_26.5.app/Contents/Developer
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: 3.44.9
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build ios --debug --no-codesign
      - name: Check CoolWear SDK integrity and native input policy
        run: |
          node --test tool/test_coolwear_ios_integration.mjs
          xcrun clang -fobjc-arc -framework Foundation test/native_coolwear_policy_test.m -o build/coolwear-policy-test
          build/coolwear-policy-test
      - run: flutter build ios --profile --no-codesign
      - run: flutter build ios --release --no-codesign
        env:
          SAIDIAN_ALLOW_QA_RELEASE: "true"
      - name: Compile RunnerTests for a generic iOS device
        run: |
          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Debug \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/ios-ci-derived \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build-for-testing
