group 'com.example.yc_product_plugin'
version '1.0'

def yuchengPluginSource = gradle.ext.yuchengPluginSource
def yuchengAndroidSource = file(yuchengPluginSource + '/android')
def yuchengLibs = file(yuchengPluginSource + '/android/libs')
def yuchengJavaSource = file(yuchengAndroidSource.path + '/src/main/java')
def patchedYuchengJavaSource = layout.buildDirectory
        .dir('generated/patched-yucheng/java')
        .get()
        .asFile

// The upstream Android plugin returns its result map as that map's own
// `data` value when the BLE read/write channel is not ready yet. Flutter's
// StandardMessageCodec cannot encode that cycle and crashes with a
// StackOverflowError. Prepare a build-local source copy with only that vendor
// defect corrected, so the fix is reproducible without editing Pub Cache.
def prepareYuchengPluginSources = tasks.register('prepareYuchengPluginSources', Sync) {
    def querySource = file(yuchengJavaSource.path +
            '/com/example/yc_product_plugin/YcProductPluginQuery.java')
    def initSource = file(yuchengJavaSource.path +
            '/com/example/yc_product_plugin/YcProductPluginInit.java')
    def brokenLine = 'map.put("data", map);'
    def initAnchor = '        YCBTClient.initClient(context, isReconnectEnable, isLogEnable);'

    doFirst {
        if (!querySource.isFile()) {
            throw new GradleException("Missing Yucheng query source: ${querySource}")
        }
        if (!initSource.isFile()) {
            throw new GradleException("Missing Yucheng init source: ${initSource}")
        }
        def occurrenceCount = new String(querySource.bytes, 'ISO-8859-1')
                .count(brokenLine)
        if (occurrenceCount != 1) {
            throw new GradleException(
                    "Expected one Yucheng cyclic-map defect, found ${occurrenceCount}. " +
                            'Review the upstream plugin before building.')
        }
        def initAnchorCount = new String(initSource.bytes, 'ISO-8859-1')
                .count(initAnchor)
        if (initAnchorCount != 1) {
            throw new GradleException(
                    "Expected one Yucheng init anchor, found ${initAnchorCount}. " +
                            'Review the upstream plugin logging setup before building.')
        }
    }

    from(yuchengJavaSource)
    into(patchedYuchengJavaSource)

    doLast {
        def patchedQuerySource = file(patchedYuchengJavaSource.path +
                '/com/example/yc_product_plugin/YcProductPluginQuery.java')
        def sourceBytes = new String(patchedQuerySource.bytes, 'ISO-8859-1')
        patchedQuerySource.bytes = sourceBytes
                .replace(brokenLine, 'map.put("data", new HashMap());')
                .getBytes('ISO-8859-1')

        def patchedInitSource = file(patchedYuchengJavaSource.path +
                '/com/example/yc_product_plugin/YcProductPluginInit.java')
        def initSourceBytes = new String(patchedInitSource.bytes, 'ISO-8859-1')
        def safeLoggingSetup = initAnchor + '''

        // The Yucheng flag does not configure the bundled JieLi loggers.  Some
        // of those loggers include TargetInfoResponse.toString(), which exposes
        // the device authentication key.  Disable only the bundled JieLi raw
        // protocol logs in every build; app-level diagnostics remain intact.
        com.jieli.jl_rcsp.util.JL_Log.configureLog(context, false, false);
        com.jieli.jl_bt_ota.util.JL_Log.setLog(false);
        com.jieli.jl_bt_ota.util.JL_Log.setIsSaveLogFile(context, false);
        com.jieli.bluetooth_connect.util.JL_Log.setLog(false);
        com.jieli.bluetooth_connect.util.JL_Log.setIsSaveLogFile(false, context);'''
        patchedInitSource.bytes = initSourceBytes
                .replace(initAnchor, safeLoggingSetup)
                .getBytes('ISO-8859-1')
    }
}

repositories {
    maven { url 'https://maven.aliyun.com/repository/public/' }
    maven { url 'https://maven.aliyun.com/repository/google/' }
    google()
    mavenCentral()
    flatDir { dirs yuchengLibs }
}

apply plugin: 'com.android.library'

android {
    namespace 'com.example.yc_product_plugin'
    compileSdk 35

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    defaultConfig {
        minSdk 26
        ndk {
            abiFilters 'armeabi', 'armeabi-v7a', 'arm64-v8a'
        }
    }

    buildTypes {
        release {
            debuggable false
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.debug
        }
    }

    sourceSets {
        main {
            manifest.srcFile file(yuchengAndroidSource.path + '/src/main/AndroidManifest.xml')
            java.srcDirs = [patchedYuchengJavaSource]
            jniLibs.srcDirs = [yuchengLibs]
        }
    }
}

tasks.named('preBuild').configure {
    dependsOn(prepareYuchengPluginSources)
}

dependencies {
    // Named flat-dir coordinates keep the vendor AARs on the app's runtime
    // classpath without triggering AGP's broken-local-AAR guard for libraries.
    api(name: 'AliAgent-release-4.2.1', ext: 'aar')
    api(name: 'BmpConvert_V1.6.0_10604-release', ext: 'aar')
    api(name: 'jl_bluetooth_connect_V1.3.2-release', ext: 'aar')
    api(name: 'jl_bt_ota_V1.10.0_10932-release', ext: 'aar')
    api(name: 'jl_rcsp_V0.7.2_527-release', ext: 'aar')
    api(name: 'JL_Watch_V1.13.1_11214-release', ext: 'aar')
    api(name: 'ycbtsdk-release', ext: 'aar')
    api fileTree(dir: yuchengLibs, include: ['*.jar'])
    api(platform('org.jetbrains.kotlin:kotlin-bom:1.8.0'))
    api 'no.nordicsemi.android:dfu:2.4.0'
    api 'com.google.code.gson:gson:2.8.6'
    api 'com.squareup.okhttp3:okhttp:4.4.0'
    api 'org.eclipse.paho:org.eclipse.paho.client.mqttv3:1.1.0'
    // The SDK's legacy dialog dependency is Jetified at build time.  Pin its
    // AndroidX replacement above the obsolete 1.0.0 namespace artifacts.
    api 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.lai.weavey:dialog:2.0.1'
}
