group 'com.jiguang.jpush'
version '1.0-SNAPSHOT'

buildscript {
    repositories {
        mavenCentral()
        google()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.5.1'
    }
}

rootProject.allprojects {
    repositories {
        mavenCentral()
        google()
    }
}

apply plugin: 'com.android.library'

android {
    if (project.android.hasProperty("namespace")) {
        namespace = "com.jiguang.jpush"
    }

    compileSdk 34
    defaultConfig {
        minSdk 19
    }
    lintOptions {
        disable 'InvalidPackage'
    }
}

dependencies {
    implementation ('cn.jiguang.sdk:jpush:6.2.0') {
        exclude group: 'cn.jiguang.sdk', module: 'jcore'
    }
    // Keep the native ABI exception in release_gate.py reproducible.
    // Strict resolution also rejects vendor/plugin requests that drift this baseline.
    implementation ('cn.jiguang.sdk:jcore:5.5.2') {
        version { strictly '5.5.2' }
    }
}
